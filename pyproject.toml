[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ads-skill"
version = "0.1.0"
description = "NASA ADS (Astrophysics Data System) API Python Toolkit & Agent Skill"
readme = "README.md"
authors = [
    { name = "hcli0228", email = "en-super@hotmail.com" }
]
license = { text = "MIT" }
keywords = ["astronomy", "astrophysics", "nasa-ads", "ads-api", "ai-agent", "bibliometrics", "solr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
    "tabulate>=0.9.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "responses>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/hcli0228/ads_skill"
Repository = "https://github.com/hcli0228/ads_skill"
Issues = "https://github.com/hcli0228/ads_skill/issues"

[project.scripts]
ads-tool = "scripts.ads_tool:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ads_api*", "scripts*"]
